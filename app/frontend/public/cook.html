<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kochansicht</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/favicon.png">
<style>
:root {
  --bg: #f5f6f4;
  --surface: #ffffff;
  --surface2: #eef0ec;
  --border: #c8cfc4;
  --accent: #526749;
  --accent2: #798A72;
  --text: #1f2b1e;
  --text2: #526749;
  --text3: #9AA893;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  max-width: 680px;
  margin: 0 auto;
  padding: 24px 20px 60px;
}
h1 {
  font-size: 26px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 6px;
  line-height: 1.2;
}
.meta {
  font-size: 13px;
  color: var(--text3);
  margin-bottom: 28px;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}
.section {
  margin-bottom: 36px;
}
.section-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text3);
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.ingredient-row {
  display: flex;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 15px;
}
.ingredient-row:last-child { border-bottom: none; }
.ing-amount { color: var(--accent); font-weight: 700; min-width: 50px; text-align: right; flex-shrink: 0; }
.ing-unit { color: var(--text2); min-width: 36px; font-size: 13px; flex-shrink: 0; }
.ing-group {
  font-size: 11px;
  font-weight: 700;
  color: var(--accent2);
  text-transform: uppercase;
  letter-spacing: .5px;
  margin: 14px 0 4px;
}
.step-row {
  display: flex;
  gap: 14px;
  margin-bottom: 20px;
  align-items: flex-start;
}
.step-num {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  flex-shrink: 0;
  margin-top: 2px;
}
.step-text {
  font-size: 15px;
  line-height: 1.7;
  flex: 1;
}
.step-img {
  width: 100%;
  max-height: 220px;
  object-fit: cover;
  border-radius: 10px;
  margin-top: 10px;
  cursor: pointer;
}
/* Zeitplan */
.timeline-step {
  display: flex;
  gap: 14px;
  margin-bottom: 14px;
  align-items: flex-start;
}
.timeline-time {
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
  min-width: 50px;
  flex-shrink: 0;
  margin-top: 2px;
}
.timeline-content { flex: 1; }
.timeline-title { font-size: 15px; font-weight: 600; }
.timeline-dur { font-size: 12px; color: var(--text3); margin-top: 2px; }
.timeline-notes { font-size: 13px; color: var(--text2); margin-top: 4px; font-style: italic; }
/* Zeitplan Controls */
.timeline-controls {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 16px;
  padding: 10px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
}
.timeline-controls label { font-size: 13px; color: var(--text2); }
.timeline-controls input[type=time] {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 5px 10px;
  border-radius: 7px;
  font-size: 14px;
  font-weight: 600;
}
.mode-btn {
  padding: 5px 12px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text2);
  font-size: 13px;
  cursor: pointer;
}
.mode-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
/* Tipps */
.notes-box {
  background: var(--surface);
  border-left: 3px solid var(--accent);
  padding: 14px 16px;
  border-radius: 0 8px 8px 0;
  font-size: 14px;
  line-height: 1.7;
  color: var(--text2);
}
/* Portionen-Rechner */
.servings-ctrl {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.servings-ctrl button {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.servings-ctrl span { font-size: 15px; font-weight: 600; min-width: 60px; text-align: center; }
/* Lightbox */
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: flex; align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox img { max-width: 92vw; max-height: 92vh; object-fit: contain; border-radius: 8px; }
/* Schliessen-Button oben */
.close-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 50;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}
.close-bar button {
  background: none;
  border: none;
  color: var(--text2);
  font-size: 22px;
  cursor: pointer;
  line-height: 1;
}
.content-wrap { margin-top: 52px; }
@media (max-width: 480px) {
  body { padding: 16px 14px 40px; font-size: 15px; }
  h1 { font-size: 21px; }
}
</style>
</head>
<body>
<div class="close-bar">
  <span id="closeTitle">Kochansicht</span>
  <button onclick="window.close()" title="Schliessen">&times;</button>
</div>
<div class="content-wrap" id="content">
  <p style="color:var(--text3);font-size:14px;padding:40px 0">Lade Rezept...</p>
</div>

<script>
const recipeId = parseInt(location.pathname.split('/').pop());
let baseServings = 4;
let currentServings = 4;
let scheduleMode = 'start';
let anchorTime = new Date();
let recipe = null;
let scheduleSteps = [];

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
// Notizen können HTML aus dem Rich-Text-Editor enthalten (Fett/Kursiv/Listen);
// alte, reine Textnotizen werden escaped und Zeilenumbrüche als <br> erhalten.
function plainTextToHtml(text) {
  if (!text) return '';
  if (String(text).indexOf('<') !== -1) return text;
  return esc(text).replace(/\n/g, '<br>');
}
function fmtTime(date) { return date.toTimeString().slice(0,5); }
function fmtDur(mins) {
  if (!mins) return '';
  return mins < 60 ? mins+'min' : Math.floor(mins/60)+'h'+(mins%60?' '+mins%60+'min':'');
}
function addMinutes(date, mins) { return new Date(date.getTime() + mins*60000); }

async function api(path) {
  const r = await fetch('/api'+path, {credentials:'include'});
  if (!r.ok) throw new Error('Fehler');
  return r.json();
}

function openLightbox(src) {
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = '<img src="'+src+'">';
  lb.onclick = function() { document.body.removeChild(lb); };
  document.body.appendChild(lb);
}

function calcAmount(amount) {
  if (!amount || !parseFloat(amount)) return amount || '';
  const num = parseFloat(amount) * currentServings / baseServings;
  return Number.isInteger(num) ? String(num) : num.toFixed(1).replace(/\.0$/, '');
}

function renderTimeline() {
  if (!scheduleSteps.length) return '';
  const anchor = new Date(anchorTime);
  let times = [];
  if (scheduleMode === 'start') {
    let t = anchor;
    scheduleSteps.forEach(function(s) { times.push(new Date(t)); t = addMinutes(t, s.duration_minutes); });
    times.push(t);
  } else {
    let t = anchor;
    times = new Array(scheduleSteps.length + 1);
    times[scheduleSteps.length] = new Date(t);
    for (let i = scheduleSteps.length - 1; i >= 0; i--) { t = addMinutes(t, -scheduleSteps[i].duration_minutes); times[i] = new Date(t); }
  }
  const anchorVal = fmtTime(scheduleMode === 'start' ? times[0] : times[times.length-1]);
  let html = '<div class="timeline-controls">';
  html += '<button class="mode-btn'+(scheduleMode==='start'?' active':'')+'" onclick="setMode(\'start\')">Ab Start</button>';
  html += '<button class="mode-btn'+(scheduleMode==='end'?' active':'')+'" onclick="setMode(\'end\')">Ab Ende</button>';
  html += '<label>'+(scheduleMode==='start'?'Startzeit:':'Endzeit:')+'</label>';
  html += '<input type="time" value="'+anchorVal+'" onchange="setAnchor(this.value)">';
  html += '</div>';
  scheduleSteps.forEach(function(s, i) {
    html += '<div class="timeline-step">';
    html += '<div class="timeline-time">'+fmtTime(times[i])+'</div>';
    html += '<div class="timeline-content">';
    html += '<div class="timeline-title">'+esc(s.title)+'</div>';
    html += '<div class="timeline-dur">'+fmtDur(s.duration_minutes)+'</div>';
    if (s.notes) html += '<div class="timeline-notes">'+esc(s.notes)+'</div>';
    html += '</div></div>';
  });
  html += '<div style="font-size:13px;color:var(--text3);margin-top:8px">Fertig: <strong style="color:var(--accent)">'+fmtTime(times[times.length-1])+'</strong></div>';
  return html;
}

function setMode(mode) { scheduleMode = mode; render(); }
function setAnchor(val) {
  const parts = val.split(':').map(Number);
  anchorTime = new Date(); anchorTime.setHours(parts[0], parts[1], 0, 0);
  render();
}
function changeServings(delta) {
  currentServings = Math.max(1, currentServings + delta);
  render();
}

function render() {
  if (!recipe) return;
  const r = recipe;
  document.title = r.title + ' – Kochansicht';
  document.getElementById('closeTitle').textContent = r.title;

  const groups = {};
  r.ingredients.forEach(function(ing) {
    const g = ing.group_name || '';
    if (!groups[g]) groups[g] = [];
    groups[g].push(ing);
  });

  let html = '<h1>'+esc(r.title)+'</h1>';
  html += '<div class="meta">';
  if (r.prep_time || r.cook_time) html += '<span>Zeitaufwand: '+fmtDur((r.prep_time||0)+(r.cook_time||0))+'</span>';
  html += '</div>';

  // Zutaten
  html += '<div class="section"><div class="section-title">Zutaten</div>';
  html += '<div class="servings-ctrl">';
  html += '<button onclick="changeServings(-1)">&#8722;</button>';
  html += '<span>'+currentServings+' Portion'+(currentServings!==1?'en':'')+'</span>';
  html += '<button onclick="changeServings(1)">&#43;</button>';
  html += '</div>';
  Object.entries(groups).forEach(function(entry) {
    const g = entry[0], ings = entry[1];
    if (g) html += '<div class="ing-group">'+esc(g)+'</div>';
    ings.forEach(function(ing) {
      html += '<div class="ingredient-row">';
      html += '<span class="ing-amount">'+calcAmount(ing.amount)+'</span>';
      html += '<span class="ing-unit">'+esc(ing.unit||'')+'</span>';
      html += '<span>'+esc(ing.name)+'</span>';
      html += '</div>';
    });
  });
  html += '</div>';

  // Zubereitung
  html += '<div class="section"><div class="section-title">Zubereitung</div>';
  r.steps.forEach(function(s) {
    html += '<div class="step-row">';
    html += '<div class="step-num">'+s.step_number+'</div>';
    html += '<div class="step-text">'+esc(s.description);
    if (s.image_path) html += '<br><img class="step-img" src="'+esc(s.image_path)+'" onclick="openLightbox(this.src)">';
    html += '</div></div>';
  });
  html += '</div>';

  // Zeitplan
  if (scheduleSteps.length) {
    html += '<div class="section"><div class="section-title">Zeitplan</div>';
    html += renderTimeline();
    html += '</div>';
  }

  // Tipps
  if (r.notes) {
    html += '<div class="section"><div class="section-title">Tipps & Variationen</div>';
    html += '<div class="notes-box">'+plainTextToHtml(r.notes)+'</div>';
    html += '</div>';
  }

  document.getElementById('content').innerHTML = html;
}

async function load() {
  try {
    const [r, sched] = await Promise.all([
      api('/recipes/'+recipeId),
      api('/recipes/'+recipeId+'/schedule').catch(function() { return []; })
    ]);
    recipe = r;
    scheduleSteps = sched;
    baseServings = r.servings || 4;
    currentServings = baseServings;
    anchorTime = new Date();
    render();
  } catch(e) {
    document.getElementById('content').innerHTML = '<p style="color:#c0392b;padding:40px 0">Rezept nicht gefunden oder kein Zugriff.</p>';
  }
}

load();
</script>
</body>
</html>
