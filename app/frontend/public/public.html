<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rezept</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/favicon.png">
<style>
:root{--bg:#f5f6f4;--surface:#ffffff;--surface2:#eef0ec;--border:#c8cfc4;--accent:#526749;--accent2:#798A72;--text:#1f2b1e;--text2:#526749;--text3:#9AA893;--red:#c0392b;--yellow:#a07830;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:16px;line-height:1.6;}
.page{max-width:860px;margin:0 auto;padding:0 0 60px;}
/* Header */
.site-header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;margin-bottom:0;}
.site-logo{font-size:18px;font-weight:800;color:var(--accent);text-decoration:none;}
.login-link{font-size:13px;color:var(--accent2);text-decoration:none;padding:7px 14px;border:1px solid var(--border);border-radius:7px;background:var(--surface2);}
.login-link:hover{border-color:var(--accent);}
/* Hero */
.hero-img{width:100%;max-height:400px;object-fit:cover;}
.hero-placeholder{width:100%;height:220px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:60px;}
/* Content */
.content{padding:28px 24px;}
.recipe-title{font-size:30px;font-weight:800;margin-bottom:10px;line-height:1.2;}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.badge{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:8px;font-size:13px;font-weight:500;background:var(--surface2);border:1px solid var(--border);}
.badge-einfach{background:#e6f0e3;color:var(--accent);}
.badge-mittel{background:#f5edda;color:var(--yellow);}
.badge-schwer{background:#fde8e6;color:var(--red);}
.meta-row{display:flex;gap:20px;font-size:14px;color:var(--text2);margin-bottom:20px;flex-wrap:wrap;}
.desc{font-size:15px;color:var(--text2);line-height:1.7;margin-bottom:28px;}
/* Nährwerte */
.nutrition-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:28px;}
.nutrition-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;}
.nutrition-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center;}
.nutrition-item{background:var(--surface2);border-radius:8px;padding:10px 6px;}
.nutrition-value{font-size:18px;font-weight:700;color:var(--accent);}
.nutrition-label{font-size:11px;color:var(--text3);margin-top:2px;}
/* Cols */
.cols{display:grid;grid-template-columns:300px 1fr;gap:28px;}
@media(max-width:640px){.cols{grid-template-columns:1fr;}}
.section-title{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px;}
/* Zutaten */
.servings-ctrl{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.servings-ctrl button{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.servings-ctrl span{font-size:14px;font-weight:600;min-width:60px;text-align:center;}
.ing-group{font-size:11px;font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 4px;}
.ingredient-row{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:14px;}
.ingredient-row:last-child{border-bottom:none;}
.ing-amount{color:var(--accent);font-weight:700;min-width:55px;text-align:right;flex-shrink:0;}
.ing-unit{color:var(--text2);min-width:36px;font-size:12px;flex-shrink:0;}
/* Schritte */
.step-row{display:flex;gap:14px;margin-bottom:18px;}
.step-num{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;margin-top:2px;}
.step-text{font-size:14px;line-height:1.7;flex:1;}
.step-img{width:100%;max-height:200px;object-fit:cover;border-radius:8px;margin-top:8px;cursor:pointer;}
/* Tags */
.tags{margin-top:20px;display:flex;flex-wrap:wrap;gap:6px;}
.tag{display:inline-block;padding:5px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--text2);}
/* Notizen */
.notes{margin-top:20px;background:var(--surface2);border-left:4px solid var(--accent);padding:14px 18px;border-radius:0 10px 10px 0;font-size:14px;line-height:1.7;color:var(--text2);}
/* Galerie */
.gallery{margin-top:28px;}
.gallery-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.gallery-thumb{width:80px;height:80px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid var(--border);transition:all .15s;}
.gallery-thumb:hover{border-color:var(--accent);transform:scale(1.05);}
/* Zeitplan */
.timeline-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;}
.timeline-controls label{font-size:13px;color:var(--text2);}
.timeline-controls input[type=time]{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:5px 10px;border-radius:7px;font-size:14px;font-weight:600;}
.mode-btn{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:13px;cursor:pointer;}
.mode-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.timeline-step{display:flex;gap:14px;margin-bottom:14px;}
.timeline-time{font-size:13px;font-weight:700;color:var(--accent);min-width:50px;flex-shrink:0;margin-top:2px;}
.timeline-content{flex:1;}
.timeline-step-title{font-size:15px;font-weight:600;}
.timeline-dur{font-size:12px;color:var(--text3);margin-top:2px;}
.timeline-notes{font-size:13px;color:var(--text2);margin-top:4px;font-style:italic;}
/* Lightbox */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:100;cursor:zoom-out;}
.lightbox img{max-width:92vw;max-height:92vh;object-fit:contain;border-radius:8px;}
/* Footer */
.source{margin-top:12px;font-size:13px;color:var(--text2);}
.source a{color:var(--accent2);}
.not-found{text-align:center;padding:80px 24px;color:var(--text2);}
.not-found h2{font-size:22px;font-weight:700;margin-bottom:8px;color:var(--text);}
</style>
</head>
<body>
<div class="site-header">
  <a class="site-logo" href="/">Rezepte</a>
  <a class="login-link" href="/">Anmelden</a>
</div>
<div class="page" id="page">
  <p style="padding:60px 24px;color:var(--text3)">Lade Rezept...</p>
</div>

<script>
const recipeId = parseInt(location.pathname.split('/').pop());
let baseServings = 4;
let currentServings = 4;
let scheduleMode = 'start';
let anchorTime = new Date();
let recipe = null;
let scheduleSteps = [];
let galleryImages = [];

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtMins(m) { if (!m) return ''; return m < 60 ? m+'min' : Math.floor(m/60)+'h '+(m%60?m%60+'min':''); }
function fmtTime(date) { return date.toTimeString().slice(0,5); }
function fmtDur(mins) { if (!mins) return ''; return mins < 60 ? mins+'min' : Math.floor(mins/60)+'h'+(mins%60?' '+mins%60+'min':''); }
function addMinutes(date, mins) { return new Date(date.getTime() + mins*60000); }

function calcAmount(amount) {
  if (!amount || !parseFloat(amount)) return amount || '';
  const num = parseFloat(amount) * currentServings / baseServings;
  return Number.isInteger(num) ? String(num) : num.toFixed(1).replace(/\.0$/,'');
}

function openLightbox(src) {
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = '<img src="'+src+'">';
  lb.onclick = function() { document.body.removeChild(lb); };
  document.body.appendChild(lb);
}

function renderTimeline() {
  if (!scheduleSteps.length) return '';
  const anchor = new Date(anchorTime);
  let times = [];
  if (scheduleMode === 'start') {
    let t = anchor;
    scheduleSteps.forEach(function(s) { times.push(new Date(t)); t = addMinutes(t, s.duration_minutes); });
    times.push(t);
  } else {
    let t = anchor;
    times = new Array(scheduleSteps.length + 1);
    times[scheduleSteps.length] = new Date(t);
    for (let i = scheduleSteps.length - 1; i >= 0; i--) { t = addMinutes(t, -scheduleSteps[i].duration_minutes); times[i] = new Date(t); }
  }
  const anchorVal = fmtTime(scheduleMode === 'start' ? times[0] : times[times.length-1]);
  let html = '<div class="timeline-controls">';
  html += '<button class="mode-btn'+(scheduleMode==='start'?' active':'')+'" onclick="setMode(\'start\')">Ab Start</button>';
  html += '<button class="mode-btn'+(scheduleMode==='end'?' active':'')+'" onclick="setMode(\'end\')">Ab Ende</button>';
  html += '<label>'+(scheduleMode==='start'?'Startzeit:':'Endzeit:')+'</label>';
  html += '<input type="time" value="'+anchorVal+'" onchange="setAnchor(this.value)">';
  html += '</div>';
  scheduleSteps.forEach(function(s, i) {
    html += '<div class="timeline-step"><div class="timeline-time">'+fmtTime(times[i])+'</div>';
    html += '<div class="timeline-content"><div class="timeline-step-title">'+esc(s.title)+'</div>';
    html += '<div class="timeline-dur">'+fmtDur(s.duration_minutes)+'</div>';
    if (s.notes) html += '<div class="timeline-notes">'+esc(s.notes)+'</div>';
    html += '</div></div>';
  });
  html += '<div style="font-size:13px;color:var(--text3);margin-top:8px">Fertig: <strong style="color:var(--accent)">'+fmtTime(times[times.length-1])+'</strong></div>';
  return html;
}

function setMode(m) { scheduleMode = m; render(); }
function setAnchor(val) {
  const parts = val.split(':').map(Number);
  anchorTime = new Date(); anchorTime.setHours(parts[0], parts[1], 0, 0);
  render();
}
function changeServings(delta) { currentServings = Math.max(1, currentServings + delta); render(); }

function render() {
  const r = recipe;
  document.title = r.title + ' – Rezepte';

  const groups = {};
  r.ingredients.forEach(function(ing) {
    const g = ing.group_name || '';
    if (!groups[g]) groups[g] = [];
    groups[g].push(ing);
  });

  let html = '';

  // Hero
  if (r.image_path) html += '<img class="hero-img" src="'+esc(r.image_path)+'" alt="'+esc(r.title)+'">';
  else html += '<div class="hero-placeholder">'+(r.category_icon||'🍽️')+'</div>';

  html += '<div class="content">';
  html += '<div class="recipe-title">'+esc(r.title)+'</div>';

  // Badges
  html += '<div class="badges">';
  if (r.category_name) html += '<span class="badge">'+(r.category_icon||'')+' '+esc(r.category_name)+'</span>';
  if (r.difficulty) html += '<span class="badge badge-'+r.difficulty+'">'+r.difficulty+'</span>';
  html += '</div>';

  // Meta
  html += '<div class="meta-row">';
  if (r.servings) html += '<span>Portionen: '+r.servings+'</span>';
  if (r.prep_time) html += '<span>Vorbereitung: '+fmtMins(r.prep_time)+'</span>';
  if (r.cook_time) html += '<span>Kochzeit: '+fmtMins(r.cook_time)+'</span>';
  html += '</div>';

  // Nährwerte
  html += '<div id="nutritionArea"></div>';

  if (r.description) html += '<div class="desc">'+esc(r.description)+'</div>';

  // Zutaten + Schritte
  html += '<div class="cols">';

  // Zutaten
  html += '<div><div class="section-title">Zutaten</div>';
  html += '<div class="servings-ctrl">';
  html += '<button onclick="changeServings(-1)">&#8722;</button>';
  html += '<span>'+currentServings+' Portion'+(currentServings!==1?'en':'')+'</span>';
  html += '<button onclick="changeServings(1)">&#43;</button>';
  html += '</div>';
  Object.entries(groups).forEach(function(entry) {
    const g = entry[0], ings = entry[1];
    if (g) html += '<div class="ing-group">'+esc(g)+'</div>';
    ings.forEach(function(ing) {
      html += '<div class="ingredient-row"><span class="ing-amount">'+calcAmount(ing.amount)+'</span><span class="ing-unit">'+esc(ing.unit||'')+'</span><span>'+esc(ing.name)+'</span></div>';
    });
  });
  html += '</div>';

  // Schritte
  html += '<div><div class="section-title">Zubereitung</div>';
  r.steps.forEach(function(s) {
    html += '<div class="step-row"><div class="step-num">'+s.step_number+'</div><div class="step-text">'+esc(s.description);
    if (s.image_path) html += '<br><img class="step-img" src="'+esc(s.image_path)+'" onclick="openLightbox(this.src)">';
    html += '</div></div>';
  });
  html += '</div></div>';

  // Zeitplan
  if (scheduleSteps.length) {
    html += '<div style="margin-top:28px"><div class="section-title">Zeitplan</div>'+renderTimeline()+'</div>';
  }

  // Tags
  if (r.tags && r.tags.length) {
    html += '<div class="tags">'+r.tags.map(function(t) { return '<span class="tag">'+esc(t.name)+'</span>'; }).join('')+'</div>';
  }

  // Notizen
  if (r.notes) html += '<div class="notes">'+esc(r.notes)+'</div>';

  // Galerie
  if (galleryImages.length > 0) {
    html += '<div class="gallery"><div class="section-title" style="margin-top:28px">Galerie</div><div class="gallery-grid">';
    galleryImages.forEach(function(img, i) {
      html += '<img class="gallery-thumb" src="'+esc(img.image_path)+'" onclick="openLightbox(this.src)">';
    });
    html += '</div></div>';
  }

  // Quelle
  if (r.source_url) html += '<div class="source">Quelle: <a href="'+esc(r.source_url)+'" target="_blank">'+esc(r.source_url)+'</a></div>';

  html += '</div>';
  document.getElementById('page').innerHTML = html;

  // Nährwerte nachladen
  fetch('/api/recipes/'+recipeId+'/nutrition')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (!data) return;
      const n = data.nutrition;
      const area = document.getElementById('nutritionArea');
      if (!area) return;
      area.innerHTML = '<div class="nutrition-box" style="margin-bottom:20px">' +
        '<div class="nutrition-title">Nahrwerte pro Portion (ca. '+data.servings+' Portionen, KI-Schatzung)</div>' +
        '<div class="nutrition-grid">' +
        '<div class="nutrition-item"><div class="nutrition-value">'+Math.round(n.calories)+'</div><div class="nutrition-label">kcal</div></div>' +
        '<div class="nutrition-item"><div class="nutrition-value">'+Math.round(n.protein)+'g</div><div class="nutrition-label">Protein</div></div>' +
        '<div class="nutrition-item"><div class="nutrition-value">'+Math.round(n.fat)+'g</div><div class="nutrition-label">Fett</div></div>' +
        '<div class="nutrition-item"><div class="nutrition-value">'+Math.round(n.carbs)+'g</div><div class="nutrition-label">Kohlenhydrate</div></div>' +
        '<div class="nutrition-item"><div class="nutrition-value">'+Math.round(n.fiber)+'g</div><div class="nutrition-label">Ballast.</div></div>' +
        '</div></div>';
    })
    .catch(function() {});
}

async function load() {
  try {
    const [r, sched, imgs] = await Promise.all([
      fetch('/api/recipes/'+recipeId).then(function(r) { if (!r.ok) throw new Error('not found'); return r.json(); }),
      fetch('/api/recipes/'+recipeId+'/schedule').then(function(r) { return r.ok ? r.json() : []; }),
      fetch('/api/recipes/'+recipeId+'/images').then(function(r) { return r.ok ? r.json() : []; })
    ]);

    if (!r.is_public) {
      document.getElementById('page').innerHTML = '<div class="not-found"><h2>Rezept nicht verfügbar</h2><p>Dieses Rezept ist nicht öffentlich zugänglich.</p><a href="/" style="color:var(--accent2);margin-top:12px;display:inline-block">Zur Startseite</a></div>';
      return;
    }

    recipe = r;
    scheduleSteps = sched;
    galleryImages = imgs;
    baseServings = r.servings || 4;
    currentServings = baseServings;
    anchorTime = new Date();
    render();
  } catch(e) {
    document.getElementById('page').innerHTML = '<div class="not-found"><h2>Rezept nicht gefunden</h2><p>Der Link ist ungültig oder das Rezept wurde gelöscht.</p><a href="/" style="color:var(--accent2);margin-top:12px;display:inline-block">Zur Startseite</a></div>';
  }
}

load();
</script>
</body>
</html>
